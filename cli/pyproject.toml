[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egresslens"
version = "0.1.0"
description = "Network egress monitoring tool using strace"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "EgressLens Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
# The Docker SDK path in egresslens.docker_runner is genuinely optional -- without
# the SDK the runner shells out to the `docker` CLI instead. cli/requirements.txt
# has always declared this, but pyproject did not, so `pip install -e cli/` (the
# documented install) never pulled it in and the SDK branch never executed, in CI
# or locally.
docker = ["docker>=6.0.0"]

[project.scripts]
egresslens = "egresslens.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["egresslens*"]

[tool.setuptools.package-data]
egresslens = ["py.typed"]
