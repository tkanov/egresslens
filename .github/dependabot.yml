# The backend requirements and the ruff pin in CI now have upper bounds, which
# stops an upstream release from breaking main with no change here -- but only at
# the cost of going stale. This is the other half: Dependabot opens the bump PRs,
# and CI decides whether they are safe.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # No update-types filter here, deliberately. backend/requirements.txt holds
      # version *ranges* rather than pinned versions, so Dependabot raises the
      # lower bound of a constraint -- a requirement update -- instead of bumping
      # a pinned version. Requirement updates carry no semver classification, as
      # their own commit trailers show: the pip PRs record dependency-name and
      # dependency-type and no update-type at all, while the npm ones (which do
      # have a lockfile to pin against) record
      # `update-type: version-update:semver-minor`.
      #
      # An update-types filter can only match a classification that is present,
      # so listing ["minor", "patch"] here excluded every dependency from the
      # group and each one got its own PR -- seven of them across two runs, which
      # is the opposite of what the group was added for. Matching on pattern
      # alone is what actually groups them.
      backend:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Grouping minor+patch is safe for packages at 1.0 or above, where a minor
      # promises not to break. It is not safe below 1.0: semver gives 0.x minors
      # no such promise, and one breaking release takes the entire group PR down
      # with it rather than just itself. eslint-plugin-react-refresh 0.4 -> 0.5
      # moved its eslint peer range to ^9 || ^10, which failed `npm ci` outright
      # and blocked the playwright, autoprefixer and postcss bumps that had been
      # grouped alongside it -- three safe updates held up by one unrelated
      # breaking change.
      #
      # Excluded packages are not skipped; anything matching no group gets its own
      # PR, which is the point. Add any dev dependency still on 0.x here, and
      # remove it once it reaches 1.0.
      frontend-dev:
        dependency-type: development
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "eslint-plugin-react-refresh"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
