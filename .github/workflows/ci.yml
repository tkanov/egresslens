name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned for the same reason the backend requirements are bounded: an
      # unpinned linter can fail main on a release with no change in this repo.
      - name: Install ruff
        run: pip install ruff==0.16.0
      - name: Check
        run: ruff check .

  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 went EOL in October 2025 and the backend's dependencies have
        # followed: fastapi >=0.129 and python-multipart >=0.0.21 both declare
        # Requires-Python >=3.10, so keeping 3.9 here holds the whole file at
        # whatever pip can still resolve for it. The image the backend actually
        # runs in (ubuntu:24.04) ships 3.12. The CLI is a separate package with
        # its own matrix and still supports 3.9.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  cli:
    name: CLI (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install strace (for the real-strace integration test)
        run: sudo apt-get update && sudo apt-get install -y strace
      # The [docker] extra is what makes egresslens.docker_runner import the
      # Docker SDK; without it DOCKER_SDK_AVAILABLE is False and that whole
      # branch is never even imported in CI.
      - name: Install package and pytest
        run: pip install -e './cli[docker]' pytest
      - name: Run CLI tests
        working-directory: cli
        run: pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # The lint script has existed since the project was scaffolded but had no
      # config file and no CI step, so it had never once run.
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build (type-check + bundle)
        working-directory: frontend
        run: npm run build
