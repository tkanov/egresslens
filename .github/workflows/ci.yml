name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned for the same reason the backend requirements are bounded: an
      # unpinned linter can fail main on a release with no change in this repo.
      - name: Install ruff
        run: pip install ruff==0.16.0
      - name: Check
        run: ruff check .

  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 went EOL in October 2025 and the backend's dependencies have
        # followed: fastapi >=0.129 and python-multipart >=0.0.21 both declare
        # Requires-Python >=3.10, so keeping 3.9 here holds the whole file at
        # whatever pip can still resolve for it. The image the backend actually
        # runs in (ubuntu:24.04) ships 3.12. The CLI is a separate package with
        # its own matrix and still supports 3.9.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            cli/pyproject.toml
      # The CLI package carries the policy and enrichment engine that app.policy
      # and app.enrichment re-export, so the backend does not import without it.
      - name: Install dependencies
        run: pip install -e ./cli -r backend/requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  cli:
    name: CLI (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install strace (for the real-strace integration test)
        run: sudo apt-get update && sudo apt-get install -y strace
      # The [docker] extra is what makes egresslens.docker_runner import the
      # Docker SDK; without it DOCKER_SDK_AVAILABLE is False and that whole
      # branch is never even imported in CI.
      - name: Install package and pytest
        run: pip install -e './cli[docker]' pytest
      - name: Run CLI tests
        working-directory: cli
        run: pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # The lint script has existed since the project was scaffolded but had no
      # config file and no CI step, so it had never once run.
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build (type-check + bundle)
        working-directory: frontend
        run: npm run build

  # The Frontend job above only proves the app typechecks and bundles. A
  # dependency bump can satisfy both and still break at runtime -- a router major
  # changing route matching, or a component throwing on render -- and nothing
  # here would have caught it. Verified against exactly that: renaming the
  # /reports/:id route leaves `npm run build` green and fails this job.
  #
  # Runs the smoke project only. The demo-recording spec needs demo-output/ from a
  # real Docker capture, so it cannot run here.
  e2e:
    name: E2E (report flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            cli/pyproject.toml
      # Playwright starts uvicorn itself via config.webServer, so the backend
      # only has to be importable on PATH here -- which includes the CLI package,
      # since app.policy re-exports its engine and uvicorn imports it at startup.
      - name: Install backend dependencies
        run: pip install -e ./cli -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        working-directory: frontend
        run: npm run test:e2e:smoke
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
